[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# `npm run build` is `astro build` only -- it reads the committed
# src/data/*.json + public/thumbnails|detail snapshot and never contacts the
# NAS. Refreshing the snapshot (`npm run data`) is a local step; commit its
# output. See docs/astro-rewrite-spec.md D7.
